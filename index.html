<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamplit - your reading room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500&family=Noto+Serif+Bengali:wght@500;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap">
<style>
@property --wall{syntax:"<color>";inherits:true;initial-value:#0c1410}
@property --wall2{syntax:"<color>";inherits:true;initial-value:#111c16}
@property --brass{syntax:"<color>";inherits:true;initial-value:#cfae6a}
:root{--wall:#0c1410;--wall2:#111c16;--brass:#cfae6a;transition:--wall 1.6s,--wall2 1.6s,--brass 1.6s;--cream:#efe6d0;--muted:#98a595;--line:color-mix(in srgb,var(--brass) 20%,var(--wall));--wood:#4b2f1b;
--disp:"Cormorant Garamond","Noto Serif Bengali","Noto Serif Devanagari",Georgia,serif;--ui:"Jost",system-ui,sans-serif;--fs:23px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--wall);color:var(--cream);font-family:var(--ui);overflow:hidden}
button,select{font:inherit;color:inherit;background:transparent;border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:2px;padding:7px 15px;cursor:pointer;letter-spacing:.02em}
button:hover,select:hover{background:color-mix(in srgb,var(--brass) 12%,transparent);border-color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hidden{display:none!important}
.view{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#shelfView{background:radial-gradient(ellipse 70% 45% at 50% -5%,color-mix(in srgb,var(--brass) 26%,transparent),transparent 70%),radial-gradient(ellipse at 50% 100%,#000,transparent 60%),linear-gradient(var(--wall2),var(--wall))}
.inner{max-width:1040px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top,0px)) 22px 170px}
.top{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
h1{font:600 clamp(40px,7vw,64px)/1 var(--disp);margin:0;letter-spacing:.04em;color:var(--brass)}
.sub{margin:4px 0 0;color:var(--muted);font:italic 500 19px var(--disp)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .pri{background:var(--brass);color:#1a1409;border-color:var(--brass);font-weight:500}
.acts .pri:hover{background:color-mix(in srgb,var(--brass) 82%,#fff)}
.orn{display:flex;align-items:center;gap:14px;margin:22px 0 26px;color:var(--brass)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brass) 60%,transparent))}.orn::after{transform:scaleX(-1)}
.stats{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;font-size:14px;color:var(--muted);margin:-8px 0 26px}
.stats b{font:600 26px var(--disp);color:var(--cream);margin-right:6px}
.meter{width:90px;height:3px;background:var(--line);display:inline-block;vertical-align:middle;margin-left:8px}.meter i{display:block;height:100%;width:0;background:var(--brass)}
.case{border:16px solid #3f2816;border-bottom:0;border-radius:6px 6px 0 0;padding:18px 14px 0;background:linear-gradient(color-mix(in srgb,var(--wall) 30%,#000),color-mix(in srgb,var(--wall2) 45%,#000));box-shadow:inset 0 0 80px #000,0 40px 70px -24px #000;position:relative}
.case::before{content:"";position:absolute;left:-16px;right:-16px;top:-16px;height:16px;background:linear-gradient(#7a5233,#4b2f1b)}
.row{display:flex;align-items:flex-end;gap:3px;height:282px;padding:0 4px}
.plank{height:18px;margin:0 -14px;background:linear-gradient(#8a5d3a,#5a3a22 40%,#2e1b0e);box-shadow:0 16px 16px -8px #000,inset 0 1px 0 rgba(255,255,255,.18)}
.spine{flex:none;border:0;border-radius:2px 2px 0 0;padding:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:var(--cream);
box-shadow:inset 2px 0 3px rgba(255,255,255,.08),inset -3px 0 5px rgba(0,0,0,.5);transition:transform .22s;overflow:hidden}
.spine:hover{transform:translateY(-16px);background-color:inherit}
.spine span{writing-mode:vertical-rl;font:600 17px/1 var(--disp);margin-top:26px;max-height:calc(100% - 70px);overflow:hidden;white-space:nowrap;letter-spacing:.03em;color:#f3e8c9;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.spine::after{content:"\25C6";position:absolute;bottom:20px;font-size:10px;color:var(--brass)}
.spine.drop{animation:drop .6s cubic-bezier(.2,.8,.3,1)}
@keyframes drop{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
.ghost{flex:none;width:48px;height:210px;border:1px dashed color-mix(in srgb,var(--brass) 50%,transparent);border-radius:2px 2px 0 0;display:flex;align-items:center;justify-content:center;color:var(--brass);font:500 30px var(--disp);cursor:pointer;transform:rotate(3deg);transform-origin:bottom left;margin-left:8px;background:none;padding:0}
.ghost:hover{background:color-mix(in srgb,var(--brass) 12%,transparent)}
.empty{color:var(--muted);font:italic 500 21px/1.5 var(--disp);margin:0 0 22px;text-align:center}
.drag .case{box-shadow:inset 0 0 80px #000,0 0 0 2px var(--brass)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
/* reader */
#readView{--tx:#e9e1cc;--ac:var(--brass);background:radial-gradient(ellipse 70% 35% at 50% 0,color-mix(in srgb,var(--brass) 18%,transparent),transparent 70%),var(--wall);color:var(--tx)}
#readView[data-rt=day]{--tx:#22252b;--ac:#7a5a1f;background:#f1efe9}
#readView[data-rt=sepia]{--tx:#3a2c19;--ac:#8a4b1f;background:#e6d8b8}
.rbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--wall) 82%,transparent);border-bottom:1px solid var(--line);color:var(--cream)}
.rbar select{background:var(--wall2)}
.rbar .t{margin-right:auto;font:600 17px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:90px;flex:1}
#prog{position:fixed;top:0;left:0;height:3px;background:var(--brass);width:0;z-index:9}
.page{max-width:33em;margin:0 auto;padding:50px 22px 190px;font:500 var(--fs)/1.7 var(--disp)}
.page h2{font:600 1.6em/1.2 var(--disp);margin:1.8em 0 .9em;text-align:center}
.page p{margin:0 0 1em;text-align:justify;hyphens:auto}
.page p:first-of-type::first-letter{font-weight:700;font-size:3.5em;float:left;line-height:.82;padding:.06em .1em 0 0;color:var(--ac)}
/* dock */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 10px;border-radius:999px;background:color-mix(in srgb,var(--wall) 90%,transparent);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--brass) 40%,transparent);z-index:20;box-shadow:0 12px 30px -8px #000;max-width:calc(100vw - 16px)}
.dock button{border-radius:999px;padding:6px 14px;font-size:14px;flex:none}.dock #now{font:italic 500 16px var(--disp);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.item.on b{color:var(--brass)}.item.on{border-left:2px solid var(--brass);padding-left:10px}
.pbtn{display:inline-block;border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);padding:7px 15px;cursor:pointer;border-radius:2px;font-size:14px}.pbtn:hover{background:color-mix(in srgb,var(--brass) 12%,transparent)}
.db select{background:var(--wall2);margin-right:8px}
.page.pdfpg{max-width:none;padding:22px 10px 190px;font:inherit}.pp{width:min(100%,var(--ppw,874px));margin:0 auto 16px;background:#fff;box-shadow:0 8px 24px -10px #000}.pp canvas{width:100%;height:auto;display:block}
#readView[data-rt=night] .pp canvas{filter:brightness(.82)}#pgno{font-size:13px;color:var(--muted);white-space:nowrap}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);transform:translateX(105%);transition:transform .3s;background:color-mix(in srgb,var(--wall) 94%,#000);border-left:1px solid color-mix(in srgb,var(--brass) 40%,transparent);z-index:40;display:flex;flex-direction:row;padding-top:env(safe-area-inset-top,0px);box-shadow:-20px 0 50px -10px #000}
.drawer.open{transform:none}
.rail{flex:none;width:74px;display:flex;flex-direction:column;gap:2px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:color-mix(in srgb,var(--wall2) 55%,#000);border-right:1px solid color-mix(in srgb,var(--brass) 35%,var(--wall))}
.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:100%;border:0;border-left:3px solid transparent;border-radius:0;padding:11px 2px 10px;font-size:11px;line-height:1.1;letter-spacing:.02em;color:var(--muted)}
.rail button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{background:color-mix(in srgb,var(--brass) 8%,transparent);color:var(--cream);box-shadow:none}
.rail button.on{color:var(--brass);border-left-color:var(--brass);background:linear-gradient(90deg,color-mix(in srgb,var(--brass) 20%,transparent),transparent)}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.dh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.dh h2{font:600 26px/1 var(--disp);color:var(--brass);margin:0}
#dx{flex:none;width:40px;height:40px;padding:0;border-radius:50%;font-size:26px;line-height:1}
.db{flex:1;overflow:auto;padding:18px 20px 40px}
.db h3{font:600 22px var(--disp);color:var(--brass);margin:22px 0 8px}.db h3:first-child{margin-top:0}
.db p,.db li{font-size:15px;line-height:1.55;color:#cfd3c6}.db ol{padding-left:20px;margin:0}
.db a{color:var(--brass)}.db small{display:block;color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.item div{min-width:0}.item b{font:600 18px var(--disp);display:block}.item span{font-size:13px;color:var(--muted)}
.item .bt{display:flex;gap:6px;flex:none}.item button{padding:4px 10px;font-size:13px}
.src{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.src a{font:600 19px var(--disp)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--brass);color:#1a1409;padding:9px 20px;border-radius:2px;font-weight:500;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
body.t-fire #shelfView{animation:fl 2.6s ease-in-out infinite alternate}
@keyframes fl{from{filter:brightness(1)}to{filter:brightness(1.15)}}
.case.edit .spine::before{content:"\00d7";position:absolute;top:3px;left:50%;margin-left:-9px;width:18px;height:18px;line-height:17px;text-align:center;border-radius:50%;background:#b3363a;color:#fff;font:700 15px var(--ui);z-index:2}
.case.edit .spine{animation:wob .5s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.danger{border-color:#b3363a!important;color:#f0b0b0}
@media (max-width:600px){.row{height:262px}.inner{padding:calc(22px + env(safe-area-inset-top,0px)) 14px 170px}.case{border-width:12px;padding:14px 8px 0}.case::before{left:-12px;right:-12px;top:-12px;height:12px}.plank{margin:0 -8px}.rbar{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;gap:6px}.rbar button,.rbar select{padding:6px 10px;font-size:13px}.page{padding:30px 16px 190px}.page p{text-align:left}.top{gap:12px}.acts button,.acts label{font-size:14px}}
@media (hover:none){.spine:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* find books + youtube */
.fbar{display:flex;gap:8px;margin:10px 0 6px}.fbar input[type=search],.fbar input[type=text],.fbar input[type=password]{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--cream);background:var(--wall2);border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:2px;padding:8px 10px}
.fbar button{flex:none}.note{font-size:13px;color:var(--muted);margin:6px 0}.warn{font-size:14px;color:#f0c9a0;border:1px solid #8a5a2a;padding:8px 10px;border-radius:2px;margin:10px 0}
.item.col{align-items:flex-start}.item button:disabled{opacity:.5;cursor:default}
.yt{position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 24px));z-index:30;background:color-mix(in srgb,var(--wall) 94%,#000);border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);border-radius:6px;box-shadow:0 18px 40px -10px #000;overflow:hidden}
.yth{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--line)}
.yth span{flex:1;min-width:0;font:600 15px var(--disp);color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yth button{padding:2px 10px;font-size:16px;line-height:1.2;border-radius:999px;flex:none}
.ytb{aspect-ratio:16/9;background:#000}.ytb iframe{width:100%;height:100%;border:0;display:block}
.yt.min .ytb{height:0;aspect-ratio:auto}.yt.min .yth{border-bottom:0}

/* game layer, selection tools */
.goalb{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--muted);font-size:14px;letter-spacing:0}.goalb:hover{background:none}
.ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--brass) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none;display:inline-block}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--wall)}
#ltitle{margin-right:8px}
.pbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--brass);border-radius:999px;transition:width .5s}
.week{display:flex;gap:8px;justify-content:space-between;margin:12px 0 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);opacity:.45}
.wd i{width:30px;height:30px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--brass) 50%,transparent);display:flex;align-items:center;justify-content:center;font-style:normal;color:#1a1409}
.wd.on i{background:none;border:1px solid color-mix(in srgb,var(--brass) 50%,transparent);color:var(--brass);font-weight:700}
.wd.now{opacity:1;color:var(--brass);font-weight:600}
.wd.now i{border:2px solid var(--brass);background:color-mix(in srgb,var(--brass) 18%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--brass) 50%,transparent);color:var(--brass)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:1px solid var(--line);border-radius:4px;padding:10px;font-size:13px;color:var(--muted)}
.badge b{display:block;font:600 17px var(--disp);color:var(--brass);margin-bottom:2px}
.badge.off{opacity:.4;filter:grayscale(1)}
.seltb{position:fixed;z-index:36;display:flex;gap:4px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--wall) 94%,#000);border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);box-shadow:0 10px 24px -8px #000}
.seltb button{border-radius:999px;padding:6px 14px;font-size:14px;border-color:transparent}
.defbox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 24px));max-height:52vh;overflow:auto;z-index:35;padding:16px 18px;border-radius:6px;background:color-mix(in srgb,var(--wall) 96%,#000);border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);box-shadow:0 18px 40px -10px #000;color:var(--cream)}
.defbox h4{font:600 24px var(--disp);color:var(--brass);margin:0 28px 8px 0}
.defbox p{font-size:15px;line-height:1.5;margin:4px 0;color:#d8dccf}.defbox .pos{font-style:italic;color:var(--muted);margin-top:10px}
#defx{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;border-radius:50%;font-size:20px;line-height:1}
mark.hl{background:color-mix(in srgb,var(--ac) 34%,transparent);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}mark.hl.hn{border-bottom:2px dotted var(--ac)}
.item span.q{display:block;margin-top:2px}.page p{white-space:pre-line}
.cf{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}.cf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cfall 2s ease-in forwards}
@keyframes cfall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.9}}
.db select{margin-bottom:8px}

/* look refresh */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#shelfView{background:radial-gradient(circle 300px at 70px 70px,color-mix(in srgb,var(--brass) 24%,transparent),transparent 70%),radial-gradient(ellipse 70% 45% at 50% -5%,color-mix(in srgb,var(--brass) 22%,transparent),transparent 70%),radial-gradient(ellipse at 50% 100%,#000,transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 2px,transparent 2px 7px),linear-gradient(var(--wall2),var(--wall))}
.brand{display:flex;align-items:center;gap:14px}
.lampsvg{width:54px;height:68px;flex:none;overflow:visible}.lampsvg .glow{transform-origin:32px 40px;animation:flick 3.4s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.65;transform:scale(.95)}45%{opacity:1;transform:scale(1.05)}100%{opacity:.8;transform:scale(1)}}
button{transition:background .2s,border-color .2s,box-shadow .2s,transform .1s}button:hover{box-shadow:0 0 16px -5px var(--brass)}button:active{transform:scale(.97)}
.acts .pri{background:linear-gradient(var(--brass),color-mix(in srgb,var(--brass) 75%,#000));box-shadow:0 6px 18px -8px var(--brass)}
.quote{text-align:center;font:italic 500 20px/1.4 var(--disp);color:var(--muted);margin:-6px auto 24px;max-width:36em}
.quote small{display:block;font:500 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;color:color-mix(in srgb,var(--brass) 70%,var(--muted));font-style:normal}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:stretch;margin:-8px 0 28px}
.stat{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--wall2) 72%,transparent);backdrop-filter:blur(4px);color:var(--muted);font-size:13px;line-height:1.25;min-width:0}
.stat b{font:600 28px/1 var(--disp);color:var(--cream);margin-right:6px}.stat .ic{width:26px;height:26px;flex:none;fill:var(--brass)}
.stat .meter{display:block;margin:7px 0 0;width:100%}.stat>div{min-width:0;flex:1}
button.stat{text-align:left;cursor:pointer;border-color:var(--line)}button.stat:hover{border-color:var(--brass);background:color-mix(in srgb,var(--wall2) 72%,transparent)}
.flame{transform-origin:50% 90%}.flame.on{animation:fl2 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px var(--brass))}.flame:not(.on){opacity:.35}
@keyframes fl2{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.1) rotate(2deg)}}
.decor{display:flex;align-items:flex-end;gap:30px;margin-left:auto;padding-right:22px;pointer-events:none}.decor svg{height:112px;width:auto;filter:drop-shadow(0 8px 5px rgba(0,0,0,.55))}
.candle .fl{transform-origin:25px 50px;animation:cflame .4s ease-in-out infinite alternate}@keyframes cflame{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
.spine{background-blend-mode:normal}.spine .rib{position:absolute;bottom:0;left:50%;margin-left:-5px;width:10px;background:linear-gradient(var(--brass),color-mix(in srgb,var(--brass) 55%,#000));clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);opacity:.95}
.spine.done::after{content:"\2605";font-size:13px;bottom:46px;color:var(--brass)}
.page{animation:rise .55s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page h2::after{content:"\2766";display:block;color:var(--ac);font-size:.7em;margin-top:.35em;opacity:.8}
.medal{--h:40;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;color:#fff6dc;flex:none;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 80% 70%),hsl(var(--h) 60% 38%) 60%,hsl(var(--h) 55% 22%));box-shadow:0 0 0 4px hsl(var(--h) 60% 28%),0 0 0 6px color-mix(in srgb,var(--brass) 60%,transparent),0 10px 28px -6px hsl(var(--h) 80% 50%);text-shadow:0 2px 3px rgba(0,0,0,.5)}
.medal.sm{width:46px;height:46px;font-size:22px;box-shadow:0 0 0 3px hsl(var(--h) 60% 28%),0 0 0 4px color-mix(in srgb,var(--brass) 55%,transparent)}.medal.off{filter:grayscale(1) brightness(.55)}
.badge .medal{margin-bottom:8px}.badge span{display:block}
.rv{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);padding:20px}
.rvc{text-align:center;max-width:340px;width:100%;padding:26px 22px 22px;border-radius:16px;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--brass) 28%,transparent),transparent 65%),color-mix(in srgb,var(--wall) 94%,#000);border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);box-shadow:0 30px 60px -20px #000;animation:popin .45s cubic-bezier(.2,1.3,.3,1)}
.rvc .medal{width:110px;height:110px;font-size:54px;margin:14px auto;animation:medalin .8s cubic-bezier(.2,1.4,.3,1)}
.rvc h3{font:600 28px/1.1 var(--disp);color:var(--brass);margin:0 0 6px}.rvc p{margin:0 0 18px;color:#cfd3c6;font-size:15px}.rvk{font:500 12px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@keyframes popin{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}@keyframes medalin{from{transform:scale(.3) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
@media (max-width:600px){.stats{grid-template-columns:1fr 1fr}.decor svg{height:92px}.lampsvg{width:44px;height:56px}}

/* pdf selection, highlights */
.pp{position:relative;overflow:hidden}
.pp .hll{position:absolute;inset:0;pointer-events:none}
.pp .hll i{position:absolute;background:rgba(255,196,0,.4);mix-blend-mode:multiply;border-radius:2px}
.pp .hll i.hn{border-bottom:2px dotted #9a6200}
.textLayer{position:absolute;left:0;top:0;transform-origin:0 0;line-height:1;text-align:initial;z-index:2;-webkit-text-size-adjust:none}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(207,174,106,.45)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer .endOfContent.active{top:0}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={xp:0,words:0,days:[],prog:{},pos:{},bm:[],rt:"night",fs:innerWidth<600?19:23,va:60,vm:45,dg:500,dw:{},qd:{},bd:{},hl:[],lk:0,owl:0,lark:0,ct:{},fin:{},medals:[],bounties:[],bv:0,fx:1};
try{Object.assign(S,JSON.parse(localStorage.getItem("lamplit")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("lamplit",JSON.stringify(S))}catch(e){}};
const dbp=new Promise(r=>{try{const q=indexedDB.open("lamplit",2);q.onupgradeneeded=()=>{const d=q.result;["b","t"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"})})};q.onsuccess=()=>{q.result.onversionchange=()=>q.result.close();r(q.result)};q.onerror=()=>r(null);q.onblocked=()=>r(null);setTimeout(()=>r(null),4000)}catch(e){r(null)}});
const idb=async(m,v,st="b")=>{const d=await dbp;if(!d)return[];return new Promise(r=>{try{const s=d.transaction(st,m==="all"?"readonly":"readwrite").objectStore(st);const q=m==="all"?s.getAll():m==="put"?s.put(v):s.delete(v);q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}})};
let books=[],cur=null,last=0,pend=0,total=1,fresh=null,editing=false,ready=false;
const R=$("readView");
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function streak(){let n=0,d=new Date();const s=new Set(S.days);if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function lvl(){return Math.floor(Math.sqrt(S.xp/10))+1}
const LT=["Newcomer","Page Turner","Bookworm","Night Reader","Lamplighter","Scholar","Sage","Librarian","Archivist","Legend"];
function hud(){const lv=lvl(),lo=(lv-1)**2*10,hi=lv**2*10,g=S.dg||500,d=Math.min(S.dw[dk(new Date())]||0,g);
$("lvl").textContent=lv;$("ltitle").textContent=LT[Math.min(lv-1,LT.length-1)];$("streak").textContent=streak();$("words").textContent=S.words.toLocaleString();$("nbm").textContent=S.bm.length;$("xpbar").style.width=Math.round((S.xp-lo)/(hi-lo)*100)+"%";
$("gdone").textContent=d.toLocaleString();$("gtot").textContent=g.toLocaleString();$("ring").style.setProperty("--p",Math.round(d/g*100));$("fl").classList.toggle("on",streak()>0);checkAll()}
function toast(t,ms){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),ms||2400)}
function addXP(n){const l0=Math.floor(Math.sqrt(S.xp/10));S.xp+=n;
if(Math.floor(Math.sqrt(S.xp/10))>l0)levelUp(l0+2);save();hud()}
/* bookshelf */
const hash=(s,m=33)=>{let h=7;for(const c of s)h=(h*m+c.charCodeAt(0))>>>0;return h};
const wc=b=>b.words||(b.words=b.paras.reduce((n,p)=>n+p.t.split(/\s+/).length,0));
function spine(b){const h=hash(b.title),w=40+h%20+Math.min(26,Math.floor(wc(b)/7000)),ht=196+hash(b.title,17)%62,hu=h%360;
const e=E("button","spine"+(b.id===fresh?" drop":""));e.style.width=w+"px";e.style.height=ht+"px";
const bands="linear-gradient(to bottom,transparent 12px,var(--brass) 12px 14px,transparent 14px 18px,var(--brass) 18px 19px,transparent 19px calc(100% - 19px),var(--brass) calc(100% - 19px) calc(100% - 18px),transparent calc(100% - 18px) calc(100% - 14px),var(--brass) calc(100% - 14px) calc(100% - 12px),transparent calc(100% - 12px))";
e.style.background=bands+",linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.1) 28%,rgba(0,0,0,.3)),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),hsl("+hu+" 36% 26%)";
const t=b.title.length>30?b.title.slice(0,29)+"\u2026":b.title;e.append(E("span",null,t));{const pr=S.prog[b.id]||0;if(pr>.02){const rb=E("i","rib");rb.style.height=Math.round(Math.min(1,pr)*38)+"px";e.append(rb)}if(pr>=.95)e.classList.add("done")}
e.title=b.title+" - "+Math.round((S.prog[b.id]||0)*100)+"% read";e.setAttribute("aria-label","Open "+b.title);e.onclick=()=>editing?delBook(b):open(b);return e}
function shelf(){const el=$("shelf");const W=el.clientWidth-8;if(W<=0)return;el.innerHTML="";$("empty").style.display=books.length?"none":"block";
const it=books.map(b=>({b,w:40+hash(b.title)%20+Math.min(26,Math.floor(wc(b)/7000))}));it.push({add:1,w:58});
const rows=[[]];let u=0;it.forEach(i=>{if(u+i.w+3>W&&rows[rows.length-1].length){rows.push([]);u=0}rows[rows.length-1].push(i);u+=i.w+3});
while(rows.length<3)rows.push([]);
rows.forEach((r,ri)=>{const row=E("div","row");r.forEach(i=>{if(i.add){const g=E("button","ghost","+");g.setAttribute("aria-label","Add a book");g.onclick=()=>$("file").click();row.append(g)}else row.append(spine(i.b))});if(!r.length&&ri>0)row.append(decor(ri));el.append(row,E("div","plank"))});fresh=null}
addEventListener("resize",()=>{clearTimeout(shelf.t);shelf.t=setTimeout(()=>{if(!$("shelfView").classList.contains("hidden"))shelf()},150)});
async function delBook(b){if(!confirm('Delete "'+b.title+'" from your shelf? Its bookmarks and reading progress will be deleted too.'))return false;
books=books.filter(k=>k!==b);S.bm=S.bm.filter(m=>m.b!==b.id);S.hl=S.hl.filter(h=>h.b!==b.id);delete S.prog[b.id];await idb("del",b.id);save();hud();shelf();if($("drawer").classList.contains("open"))panel();toast("Book deleted");return true}
$("edit").onclick=()=>{editing=!editing;document.querySelector(".case").classList.toggle("edit",editing);$("edit").textContent=editing?"Done":"Edit shelf";if(editing)toast("Tap a book to delete it")};
/* reader */
let curDoc=null,obs=null,rq=Promise.resolve();
const PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function unr(d){if(d.dataset.r){d.dataset.r="";d.innerHTML=""}}
function qd(d){if(d.dataset.r)return;d.dataset.r="1";rq=rq.then(()=>drawPg(d)).catch(e=>{d.dataset.r="";d.textContent="Could not draw this page ("+((e&&e.message)||"error").slice(0,80)+")"})}
async function drawPg(d){if(d.dataset.r!=="1"||!curDoc)return;const px=await curDoc.getPage(+d.dataset.n),v0=px.getViewport({scale:1}),cw=Math.max(300,d.clientWidth),w=Math.min(1500,cw*Math.min(2,devicePixelRatio||1)),vp=px.getViewport({scale:w/v0.width});
const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await px.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
if(d.dataset.r!=="1")return;
const tv=px.getViewport({scale:cw/v0.width}),tl=E("div","tl textLayer"),hl=E("div","hll");tl.style.width=tv.width+"px";tl.style.height=tv.height+"px";tl.style.setProperty("--scale-factor",tv.scale);tl.dataset.w=tv.width;
d.innerHTML="";d.append(c,hl,tl);d.dataset.r="2";tl.style.transform="scale("+(d.clientWidth/tv.width||1)+")";paintHL(d);
px.getTextContent().then(tc=>{if(tl.isConnected&&window.pdfjsLib&&pdfjsLib.renderTextLayer)return pdfjsLib.renderTextLayer({textContentSource:tc,container:tl,viewport:tv,textDivs:[]}).promise}).catch(()=>{})}
function paintHL(d){const hl=d.querySelector(".hll");if(!hl||!cur)return;hl.innerHTML="";const n=+d.dataset.n-1;
S.hl.filter(h=>h.pdf&&h.b===cur.id&&h.pi===n).forEach(h=>(h.r||[]).forEach(r=>{const i=document.createElement("i");if(h.n)i.className="hn";i.style.cssText="left:"+r[0]*100+"%;top:"+r[1]*100+"%;width:"+r[2]*100+"%;height:"+r[3]*100+"%";hl.append(i)}))}
addEventListener("resize",()=>{document.querySelectorAll(".pp .tl").forEach(t=>{const k=t.parentElement.clientWidth/+t.dataset.w;if(k)t.style.transform="scale("+k+")"})});
function closeDoc(){if(obs){obs.disconnect();obs=null}if(curDoc){try{curDoc.destroy()}catch(e){}curDoc=null}}
async function openDoc(file){pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
const mk=async()=>pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
try{return await mk()}catch(e){if(e&&e.name==="PasswordException")throw e;
await new Promise((ok,no)=>{const x=document.createElement("script");x.src=PDFW;x.onload=ok;x.onerror=()=>no(new Error("Could not download the PDF engine. Check your internet."));document.head.append(x)});
return await mk()}}
async function buildPdf(b,pg){const fail=m=>{pg.append(E("p",null,m));toast(m,7000)};
if(!window.pdfjsLib){fail("The PDF viewer did not load. Check your internet connection and reload the page.");return}
try{curDoc=await openDoc(b.pdf)}catch(e){fail(e&&e.name==="PasswordException"?"This PDF is password protected.":"Could not open this PDF: "+((e&&e.message)||"unknown error").slice(0,120));return}
b.pages=curDoc.numPages;b.words=b.pages*250;total=b.words;S.np=S.np||{};S.np[b.id]=b.pages;save();
const v=(await curDoc.getPage(1)).getViewport({scale:1});pg.className="page pdfpg";
obs=new IntersectionObserver(es=>es.forEach(en=>en.isIntersecting?qd(en.target):unr(en.target)),{root:R,rootMargin:"1500px 0px"});
for(let n=1;n<=curDoc.numPages;n++){const d=E("div","pp");d.dataset.n=n;d.style.aspectRatio=v.width+" / "+v.height;pg.append(d);obs.observe(d)}}
async function open(b,p,pi){closeDrawer();closeDoc();cur=b;$("rtitle").textContent=b.title;const pg=$("page");pg.innerHTML="";pg.className="page";
ready=false;total=wc(b);let rp=p!=null?p:(S.pos[b.id]!=null?S.pos[b.id]:(S.prog[b.id]||0));if(p==null&&rp>.98)rp=0;last=rp;pend=0;$("shelfView").classList.add("hidden");R.classList.remove("hidden");R.scrollTop=0;
if(b.pdf)await buildPdf(b,pg);else b.paras.forEach((q,i)=>{const e=document.createElement(q.h?"h2":"p");renderPara(e,q.t,b.id,i);pg.append(e)});
if(cur!==b)return;requestAnimationFrame(()=>{R.scrollTop=last*(R.scrollHeight-R.clientHeight);if(pi!=null){const el=pg.children[pi];if(el)el.scrollIntoView({block:"center"})}onScroll();setTimeout(()=>{if(cur===b)ready=true},350)})}
$("del").onclick=async()=>{if(cur&&await delBook(cur))$("back").onclick()};
$("back").onclick=()=>{ready=false;save();closeDoc();$("pgno").textContent="";R.classList.add("hidden");$("shelfView").classList.remove("hidden");$("prog").style.width="0";cur=null;save();shelf()};
function pos(){const m=R.scrollHeight-R.clientHeight;return m>0?Math.min(1,R.scrollTop/m):0}
function onScroll(){if(!cur)return;const p=pos();$("prog").style.width=p*100+"%";$("pgno").textContent=cur.pdf&&cur.pages?"Page "+(Math.round(p*(cur.pages-1))+1)+" / "+cur.pages:"";
if(!ready)return;S.pos[cur.id]=p;
if(p>last&&p-last<.15){const w=(p-last)*total;S.words+=Math.round(w);addToday(Math.round(w));{const hh=new Date().getHours();if(hh>=23||hh<4)S.owl=1;else if(hh>=4&&hh<7)S.lark=1}pend+=w;const g=Math.floor(pend/40);if(g>0){pend-=g*40;addXP(g)}else{save();hud()}}

$("page").addEventListener("click",e=>{if(!cur||!cur.pdf)return;const s=getSelection();if(s&&!s.isCollapsed)return;const pp=e.target.closest&&e.target.closest(".pp");if(!pp)return;
const pr=pp.getBoundingClientRect(),x=(e.clientX-pr.left)/pr.width,y=(e.clientY-pr.top)/pr.height,n=+pp.dataset.n-1;
const h=S.hl.find(h=>h.pdf&&h.b===cur.id&&h.pi===n&&(h.r||[]).some(r=>x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]));if(h)hlBox(h.id)});
function hlBox(id){const h=S.hl.find(x=>x.id===id);if(!h)return;const ed=E("button",null,h.n?"Edit note":"Add note"),rm=E("button","danger","Remove");
ed.onclick=()=>{const n=prompt("Your note",h.n||"");if(n===null)return;h.n=n.trim();save();rerender(h);hlBox(id)};
rm.onclick=()=>{S.hl=S.hl.filter(x=>x.id!==id);save();rerender(h);$("defbox").classList.add("hidden");hud()};
box("Highlight",[E("p",null,"\u201c"+h.q+"\u201d")].concat(h.n?[E("p",null,h.n)]:[]),[ed,rm])}
const strip=h=>new DOMParser().parseFromString(h,"text/html").body.textContent.trim();
const cw=s=>(s||"").replace(/^[^\p{L}\p{M}]+|[^\p{L}\p{M}]+$/gu,"").replace(/\s+/g," ");
const DC=()=>(S.dc&&typeof S.dc==="object"&&!Array.isArray(S.dc))?S.dc:(S.dc={}),DH=()=>Array.isArray(S.dh)?S.dh:(S.dh=[]);
const tmo=ms=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal};
async function dEn(w){const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w.toLowerCase()),{signal:tmo(6000)});if(!r.ok)throw 0;const j=await r.json(),n=[];
if(j[0].phonetic)n.push({k:"pos",t:j[0].phonetic});
(j[0].meanings||[]).slice(0,3).forEach(m=>{n.push({k:"pos",t:m.partOfSpeech||""});(m.definitions||[]).slice(0,2).forEach(x=>n.push({k:"def",t:x.definition}))});
if(!n.some(x=>x.k==="def"))throw 0;return n}
async function dDm(w){const r=await fetch("https://api.datamuse.com/words?sp="+encodeURIComponent(w.toLowerCase())+"&md=d&max=1",{signal:tmo(6000)});if(!r.ok)throw 0;const j=await r.json();
if(!j.length||j[0].word.toLowerCase()!==w.toLowerCase()||!j[0].defs||!j[0].defs.length)throw 0;
const P={n:"noun",v:"verb",adj:"adjective",adv:"adverb"},n=[];let last="";
j[0].defs.slice(0,5).forEach(s=>{const i=s.indexOf("\t"),p=P[s.slice(0,i)]||"";if(p&&p!==last){n.push({k:"pos",t:p});last=p}n.push({k:"def",t:s.slice(i+1)})});return n}
async function dWk(w){for(const x of[w,w.toLowerCase()]){const r=await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(x),{signal:tmo(7000)});if(!r.ok)continue;const j=await r.json(),n=[];
Object.values(j).flat().slice(0,4).forEach(en=>{n.push({k:"pos",t:(en.language||"")+(en.partOfSpeech?" - "+en.partOfSpeech:"")});(en.definitions||[]).slice(0,2).forEach(df=>{const t=strip(df.definition||"");if(t)n.push({k:"def",t})})});
if(n.some(x=>x.k==="def"))return n}throw 0}
/* asks two dictionaries at once and uses whichever answers first; Wiktionary joins in after 1.5s or if both fail; answers are remembered */
async function getDef(w){const k=w.toLowerCase(),c=DC();if(c[k])return c[k];let n=null;
try{if(/^[A-Za-z'-]+$/.test(w)){const fast=Promise.any([dEn(w),dDm(w)]),slow=new Promise(r=>setTimeout(r,1500)).then(()=>dWk(w));n=await Promise.any([fast.catch(()=>dWk(w)),slow])}else n=await dWk(w)}catch(e){n=null}
if(n){c[k]=n;const ks=Object.keys(c);if(ks.length>250)ks.slice(0,ks.length-250).forEach(x=>delete c[x]);save()}return n}
const defNodes=n=>n.map(x=>E("p",x.k==="def"?null:"pos",x.t));
const firstDef=n=>(n.find(x=>x.k==="def")||{}).t||"";
function noteLookup(w){const h=DH(),k=w.toLowerCase(),i=h.findIndex(x=>x.toLowerCase()===k);if(i>=0)h.splice(i,1);h.unshift(w);if(h.length>60)h.length=60;save();addXP(2);quest("lookup");hud()}
async function define(word,o){const w=cw(word);if(!w)return;box(w,[E("p","note","Looking up...")]);
if(!online()&&!DC()[w.toLowerCase()]){box(w,[E("p",null,"You are offline. Looking up new words needs internet.")]);return}
const n=await getDef(w);if(!n){box(w,[E("p",null,online()?"No definition found, or the dictionary is not answering. Try again in a moment.":"You are offline.")]);return}
noteLookup(w);const fd=firstDef(n),sv=E("button",null,"Save as note");sv.onclick=()=>{addHL(o,w+": "+fd);sv.disabled=true};box(w,defNodes(n),o?[sv]:[])}
const D={q:"",w:"",n:null,busy:false,err:""};
function dictPanel(d){d.append(E("p",null,"Type any word. Words you look up are remembered here and open instantly, even offline."));
const f=E("form","fbar"),i=E("input");i.type="search";i.placeholder="Word to look up";i.value=D.q;i.autocomplete="off";i.autocapitalize="none";i.spellcheck=false;i.setAttribute("aria-label","Word to look up");i.oninput=()=>{D.q=i.value};
const b=E("button",null,"Look up");b.type="submit";f.append(i,b);
f.onsubmit=async e=>{e.preventDefault();const w=cw(D.q);if(!w)return;D.w=w;D.n=null;D.err="";
if(!online()&&!DC()[w.toLowerCase()]){D.err="You are offline. Looking up new words needs internet.";panel();return}
D.busy=true;panel();const n=await getDef(w);if(D.w!==w)return;D.busy=false;if(n){D.n=n;noteLookup(w)}else D.err=online()?"No definition found, or the dictionary is not answering. Check the spelling or try again.":"You are offline.";if(tab==="dict"&&drawerOpen())panel()};
d.append(f);
if(D.busy)d.append(E("p","note","Looking up..."));
if(D.err)d.append(E("div","warn",D.err));
if(D.n){d.append(E("h3",null,D.w));defNodes(D.n).forEach(x=>d.append(x))}
const h=DH();if(h.length){d.append(E("h3",null,"Recent words"));
h.forEach(w=>{const c=DC()[w.toLowerCase()],it=E("div","item"),x=E("div");x.append(E("b",null,w));if(c)x.append(E("span",null,firstDef(c).slice(0,70)));
const bt=E("div","bt"),v=E("button",null,"View"),r=E("button",null,"Remove");
v.onclick=()=>{D.w=w;D.q=w;D.err="";D.busy=false;D.n=c||null;if(!c){D.q=w;D.err="Not saved offline. Look it up again."}panel();$("dbody").scrollTop=0};
r.onclick=()=>{const k=w.toLowerCase();S.dh=DH().filter(y=>y.toLowerCase()!==k);delete DC()[k];save();panel()};
bt.append(v,r);it.append(x,bt);d.append(it)})}
if(!D.n&&!D.busy&&matchMedia("(pointer:fine)").matches)setTimeout(()=>i.focus(),60)}
$("sdef").onclick=()=>{const o=ps;if(o)define(o.text,o)};
function notesPanel(d){d.append(E("h3",null,"Notes and highlights"));
if(!S.hl.length){d.append(E("p",null,"Select text while reading, then tap Highlight or Note. Define looks up a word. This works for EPUB, text and PDF books. Scanned PDFs are only pictures of pages, so their text cannot be selected."));return}
const cp=E("button",null,"Copy all");cp.onclick=()=>{const t=S.hl.map(h=>h.t+"\n\u201c"+h.q+"\u201d"+(h.n?"\nNote: "+h.n:"")).join("\n\n");try{navigator.clipboard.writeText(t).then(()=>toast("Notes copied"),()=>toast("Could not copy"))}catch(e){toast("Could not copy")}};d.append(cp);
S.hl.slice().reverse().forEach(h=>{const it=E("div","item col"),w=E("div");w.style.flex="1";w.append(E("b",null,h.t),E("span","q","\u201c"+h.q.slice(0,160)+(h.q.length>160?"...":"")+"\u201d"));
if(h.n){const n=E("p",null,h.n);n.style.margin="6px 0 0";w.append(n)}
const bt=E("div","bt"),go=E("button",null,"Go"),x=E("button",null,"Delete");go.onclick=()=>{const bk=books.find(b=>b.id===h.b);bk?open(bk,null,h.pi):toast("That book was removed")};
x.onclick=()=>{S.hl=S.hl.filter(k=>k.id!==h.id);save();hud();panel()};bt.append(go,x);it.append(w,bt);d.append(it)})}
$("goalb").onclick=()=>openDrawer("goals");
hud();shelf();idb("all").then(a=>{books=a||[];books.forEach(b=>{if(b.pdf&&!b.pages)b.pages=(S.np||{})[b.id]||0});migrate();shelf()});
